# Release Workflow

name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: yes | sdkmanager "ndk;25.2.9519653"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Memory Optimization
        run: |
          echo 'Optimize memory usage'
          # Add memory optimization commands if necessary

      - name: Asset Handling
        working-directory: ./android
        run: |
          echo 'Handling assets'
          ./gradlew processReleaseResources

      - name: Archive APK
        run: |
          mkdir -p output/apk
          cp android/app/build/outputs/apk/release/app-release.apk output/apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: output/apk/app-release.apk

      - name: Cleanup
        run: |
          echo 'Cleaning up temporary files'
          rm -rf output

      - name: Notify Success
        if: success() 
        run: |
          echo 'Build and release successful!'
